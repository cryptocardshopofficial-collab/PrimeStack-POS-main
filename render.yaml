# PrimeStack Global Server Network — split public site and dashboard blueprint.
#
# The platform service hosts the operator console and internal API.
# The public marketing website runs as a separate web service and port.
services:
  - type: web
    name: primestack-platform
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    branch: main
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node start-platform.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render assigns PORT; the API listens internally on API_PORT.
      - key: API_PORT
        value: 9006
      - key: HOST
        value: 0.0.0.0
      # Configure this in Render with the trusted proxy CIDRs for the deployment.
      # Never use an unrestricted range: T2T IP allowlists depend on request.ip.
      - key: TRUSTED_PROXIES
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: APP_NAME
        value: primestack-global-server-network

      # ── Data stores ───────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: primestack-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: primestack-redis
          property: connectionString
      # Set the exact browser origins allowed by the API in production.
      - key: CORS_ORIGINS
        sync: false

      # ── Auth / signing ────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: COOKIE_SECURE
        value: "true"
      - key: HMAC_ALGORITHM
        value: sha256
      - key: HMAC_HEADER_PREFIX
        value: x-primestack
      # Console operator key — the seed writes this key so the console can sign
      # its proxied API calls.
      - key: CONSOLE_HMAC_KEY_ID
        value: psk_console_001
      - key: CONSOLE_HMAC_SECRET
        generateValue: true

      # ── Limits / i18n ─────────────────────────────
      - key: RATE_LIMIT_MAX
        value: 1000
      - key: RATE_LIMIT_WINDOW
        value: 60
      - key: DEFAULT_LANGUAGE
        value: en
      - key: SUPPORTED_LANGUAGES
        value: en,fr,es,ar,pt

      # ── Secrets / integrations ────────────────────
      # Supply exactly 64 hexadecimal characters; S2S crypto validates this format.
      - key: S2S_SECRET_KEY
        sync: false
      # Supply a Base64-encoded 32-byte key; the vault validates this format.
      - key: BANK_DETAILS_ENCRYPTION_KEY
        sync: false
      - key: BANK_IN2_ACCOUNT_HOLDER
        value: M/S.UNITED SOLAR AND WIND POWER TECHNOLOGIES
      - key: BANK_IN2_BANK_NAME
        value: ICICI Bank
      - key: BANK_IN2_CURRENCY
        value: INR
      - key: BANK_IN2_COUNTRY
        value: IN
      - key: BANK_IN2_GATEWAY
        value: ICICI_EAZYPAY
      - key: BANK_IN2_SWIFT_BIC
        value: ICICINBBCTS

      # ── Wise rails (fiat receiving + virtual IBANs) ───
      # Fill the three secrets in the Render dashboard — they are not stored
      # in this blueprint. Without them the rails service stays in simulation.
      - key: WISE_ENV
        value: sandbox
      - key: WISE_API_KEY
        sync: false
      - key: WISE_PROFILE_ID
        sync: false
      - key: WISE_WEBHOOK_PUBLIC_KEY
        sync: false
      - key: RAILS_PORT
        value: 9007
      - key: RAILS_PAYOUT_DELAY_MS
        value: 0

  # Public website; sign-in and API requests are proxied to primestack-platform.
  - type: web
    name: primestack-public-site
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: node start-public-site.js
    healthCheckPath: /health
    envVars:
      - key: WEBSITE_HOST
        value: 0.0.0.0
      - key: DASHBOARD_ORIGIN
        fromService:
          type: web
          name: primestack-platform
          property: url

  # Static documentation site — unchanged, served from ./docs.
  - type: web
    name: primestack-website
    runtime: static
    branch: main
    staticPublishPath: ./docs
    buildCommand: echo done
    pullRequestPreviewsEnabled: false

  # Managed Key Value (Redis-compatible) — backs rate limiting, caching and queues.
  # Internal-only (empty ipAllowList): reachable from services in the same region.
  - type: keyvalue
    name: primestack-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: primestack-postgres
    databaseName: primestack
    user: primestack
    plan: 0.5c-1g
    region: oregon
