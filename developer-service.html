<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#020914">
  <title>PrimeStack Developer Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#020914;--panel:#08111f;--blue:#0ea5e9;--cyan:#55d6e8;--violet:#8b5cf6;--emerald:#10b981;--text:#e2e8f0;--muted:#8d9db3;--line:rgba(120,170,220,.14)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;overflow-x:hidden}a{text-decoration:none;color:inherit}
    .nav{position:fixed;z-index:30;top:0;left:0;right:0;height:64px;background:rgba(2,9,20,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    .nav-inner{max-width:1180px;height:100%;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
    .logo{font-family:"Space Grotesk";font-weight:700}.logo span{color:#6cc0ff}.nav-links{display:flex;gap:20px}.nav-links a{font-size:12px;color:var(--muted)}.nav-links a:hover{color:#fff}
    .hero{min-height:680px;height:78vh;padding:64px max(24px,calc((100vw - 1180px)/2)) 0;display:flex;align-items:center;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
    .hero::before{content:"";position:absolute;inset:64px 0 0;background:linear-gradient(90deg,rgba(2,9,20,.98),rgba(2,9,20,.78) 48%,rgba(2,9,20,.2)),url("/Designer%20(1).jpg") center/cover;opacity:.85}
    .hero::after{content:"";position:absolute;width:600px;height:600px;right:-300px;top:-180px;border-radius:50%;border:1px solid rgba(85,214,232,.18);box-shadow:0 0 120px rgba(14,165,233,.08)}
    .hero-copy{position:relative;z-index:2;max-width:760px}.eyebrow{color:#78baff;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.16em}.hero h1{font-family:"Space Grotesk";font-size:clamp(58px,8vw,104px);line-height:.88;letter-spacing:-.07em;margin:18px 0 26px;text-transform:uppercase}.hero h1 em{font-style:normal;color:#78baff}.hero p{max-width:650px;color:#b2c0d3;font-size:17px;line-height:1.75}.actions{display:flex;gap:10px;margin-top:30px}.button{height:48px;padding:0 18px;border-radius:7px;display:inline-flex;align-items:center;font-size:13px;font-weight:700;border:1px solid var(--line);transition:.25s}.button.primary{background:var(--blue);border-color:var(--blue);color:white}.button:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(14,165,233,.14)}
    main{max-width:1180px;margin:auto;padding:100px 24px}.section-head{display:grid;grid-template-columns:.6fr 1.4fr;gap:50px;margin-bottom:44px}.section-head h2{font-family:"Space Grotesk";font-size:clamp(38px,5vw,58px);line-height:1;letter-spacing:-.05em;margin:6px 0}.section-head p{color:var(--muted);line-height:1.75}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{min-height:220px;padding:24px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,rgba(255,255,255,.025),rgba(14,165,233,.025));transition:.3s}.card:hover{transform:translateY(-8px);border-color:rgba(85,214,232,.38);box-shadow:0 20px 60px rgba(0,0,0,.22)}.card-no{font-family:"JetBrains Mono";font-size:10px;color:#78baff}.card h3{font-family:"Space Grotesk";font-size:20px;margin:28px 0 10px}.card p{font-size:13px;color:var(--muted);line-height:1.65}
    .flow{margin-top:90px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid var(--line);border-radius:12px;padding:24px;background:var(--panel)}.panel h3{font-family:"Space Grotesk";margin:0 0 18px}.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}.step-no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(14,165,233,.12);color:#78baff;font-size:11px}.step strong{display:block;font-size:13px}.step span{font-size:12px;color:var(--muted);line-height:1.55}
    pre{margin:0;overflow:auto;padding:20px;border-radius:8px;background:#02070f;border:1px solid var(--line);color:#a9d4ff;font-family:"JetBrains Mono";font-size:12px;line-height:1.75}
    .service-nav{max-width:1180px;margin:auto;padding:0 24px 30px;display:flex;gap:8px;overflow:auto}.service-nav a{white-space:nowrap;padding:9px 12px;border:1px solid var(--line);border-radius:6px;font-size:11px;color:var(--muted)}.service-nav a.active,.service-nav a:hover{border-color:var(--blue);color:#fff;background:rgba(14,165,233,.08)}
    @media(max-width:800px){.nav-links{display:none}.hero{height:680px;min-height:680px}.hero h1{font-size:52px}.section-head,.flow{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.hero p{font-size:15px}.actions{flex-wrap:wrap}.service-nav{margin-top:-20px}.nav-inner{padding:0 16px}}
  </style>
</head>
<body>
  <nav class="nav"><div class="nav-inner"><a href="/" class="logo">PRIME<span>STACK</span></a><div class="nav-links"><a href="/developer">Developer</a><a href="/developer/t2t">T2T</a><a href="/developer/s2s">S2S</a><a href="/developer/security">Security</a><a href="/developer/banking">Banking</a></div></div></nav>
  <header class="hero"><div class="hero-copy"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="description"></p><div class="actions"><a class="button primary" href="/developer#onboarding">Register integration</a><a class="button" href="/developer#t2t">Developer guide</a></div></div></header>
  <nav class="service-nav" id="serviceNav"></nav>
  <main>
    <div class="section-head reveal"><div><div class="eyebrow">Service definition</div></div><div><h2 id="sectionTitle"></h2><p id="sectionDescription"></p></div></div>
    <div class="grid" id="serviceCards"></div>
    <div class="flow"><div class="panel"><h3 id="flowTitle">Request lifecycle</h3><div id="flowSteps"></div></div><div class="panel"><h3>Example request</h3><pre id="exampleCode"></pre></div></div>
  </main>
  <script>
    const services={
      "t2t":{"nav":"T2T","eyebrow":"Terminal-to-Terminal","title":"Terminal.<br><em>To terminal.</em>","description":"Move funds directly from one registered external terminal to another PrimeStack terminal with signed requests, IP controls, replay protection, ledger posting, and transaction status.","section":"Funds move between terminal accounts.","detail":"Terminal-to-terminal service initiates a payment from a sender terminal to a destination terminal. The sender is network-verified, the amount and currency are validated, and both sides receive an auditable ledger-backed result.","cards":[["01","Terminal verification","Verify the terminal identity and approved sender IP before processing."],["02","Signed transfer","Authenticate the request with HMAC-SHA256 credentials."],["03","Double-entry posting","Debit the source terminal and credit the destination terminal atomically."]],"flow":[["Register","Submit sender terminal and public IP details."],["Whitelist","PrimeStack approves the sender network address."],["Sign","Create the timestamp and HMAC signature."],["Transfer","POST the amount, currency, source, and destination."],["Confirm","Receive transaction reference and final balance state."]],"code":"POST /t2t/transfer\\n{\\n  \\\"type\\\": \\\"T2T\\\",\\n  \\\"amount\\\": \\\"1000.00\\\",\\n  \\\"currency\\\": \\\"USD\\\",\\n  \\\"sourceId\\\": \\\"SA-TERM-001\\\",\\n  \\\"destId\\\": \\\"PST-001-PRIME\\\"\\n}"},
      "s2s":{"nav":"S2S","eyebrow":"Server-to-Server","title":"Server.<br><em>To server.</em>","description":"Exchange payment instructions directly between two authenticated application servers, with webhook callbacks, idempotency, signed responses, and auditable network processing.","section":"Applications communicate without browser dependencies.","detail":"Server-to-server service creates a secure machine-to-machine integration between a sender server and the PrimeStack network. It is designed for backend systems, automated treasury operations, terminals, and trusted partner platforms.","cards":[["01","Machine authentication","Authenticate backend clients with key ID, timestamp, and HMAC signature."],["02","Idempotent processing","Use a unique request reference so retries do not duplicate transfers."],["03","Event delivery","Receive signed callbacks for accepted, completed, failed, or reversed states."]],"flow":[["Configure","Register the partner server and callback URL."],["Authenticate","Sign each JSON request before transmission."],["Submit","POST the payment instruction to the network API."],["Monitor","Query status or process the signed event callback."],["Reconcile","Match the reference to ledger and settlement records."]],"code":"POST /api/s2s/transfer\\n{\\n  \\\"idempotencyKey\\\": \\\"PS-REQ-20261107-001\\\",\\n  \\\"amount\\\": \\\"2500.00\\\",\\n  \\\"currency\\\": \\\"USD\\\",\\n  \\\"sourceAccount\\\": \\\"SENDER-001\\\",\\n  \\\"destinationAccount\\\": \\\"PRIME-001\\\"\\n}"},
      "external-terminal":{"nav":"External Terminals","eyebrow":"Terminal Network","title":"External.<br><em>terminals.</em>","description":"Register, verify, and operate terminals outside the PrimeStack core environment through approved network endpoints and controlled transfer credentials.","section":"Bring approved external terminal infrastructure online.","detail":"The external terminal service defines the onboarding and operating boundary for customer-owned terminals. It validates network location, terminal identity, customer purpose, currency capability, and transaction authorization policy.","cards":[["01","Terminal registration","Bind terminal ID, customer, country, and public server."],["02","Network whitelist","Allow approved public IP addresses and reject unknown callers."],["03","Continuous operation","Monitor connectivity, balances, transfer health, and rejected requests."]],"flow":[["Onboard","Create sender customer and terminal information."],["Whitelist","Approve sender public IP address."],["Provision","Issue HMAC key ID and signing secret securely."],["Verify","Run Ping and health checks."],["Operate","Enable signed terminal transfers and monitoring."]],"code":"POST /t2t/ping\\n{\\n  \\\"terminalId\\\": \\\"SA-TERM-001\\\"\\n}"},
      "api":{"nav":"API Gateway","eyebrow":"Developer API","title":"One.<br><em>API layer.</em>","description":"Access PrimeStack resources through structured REST APIs, consistent errors, idempotency, versioned resources, and predictable transaction states.","section":"Build integrations against one documented interface.","detail":"The API gateway exposes controlled payment platform resources without requiring partners to understand each internal service. Requests are validated, authenticated, routed, and recorded across the network.","cards":[["01","REST resources","Use consistent JSON endpoints for account, transfer, wallet, and status operations."],["02","Stable responses","Parse structured success, validation, authentication, and conflict results."],["03","Developer tooling","Test credentials, ping endpoints, examples, and integration workflows."]],"flow":[["Authenticate","Send key ID, timestamp, nonce, and signature."],["Validate","Reject malformed or replayed requests."],["Route","Forward the operation to the target platform service."],["Respond","Return resource state and reference data."],["Audit","Record the request for security and operations review."]],"code":"GET /api/health\\nAuthorization: HMAC-SHA256\\nx-primestack-key-id: psk_example\\nx-primestack-timestamp: 1762529200000"},
      "security":{"nav":"Security","eyebrow":"Authentication & Access","title":"Secure.<br><em>by design.</em>","description":"Protect every machine interaction with HMAC signatures, timestamp checks, replay resistance, IP whitelists, TLS, secrets, and least-privilege controls.","section":"Every request has a verifiable trust boundary.","detail":"PrimeStack security service validates caller identity and request integrity before the payment operation reaches routing or ledger code. Secrets remain private, public key IDs identify credentials, and sensitive requests are replay-resistant.","cards":[["01","HMAC-SHA256","Authenticate key ID, timestamp, and exact request body."],["02","Replay protection","Reject repeated timestamp, nonce, or request signature combinations."],["03","Network access","Limit callers to approved IP addresses and terminal identities."]],"flow":[["Issue credential","Create a key ID and private HMAC secret."],["Sign request","Hash key, timestamp, nonce, and canonical body."],["Verify network","Check sender IP and identity allowlist."],["Validate signature","Reject expired timestamps and replay attempts."],["Authorize","Continue only if all trust controls pass."]],"code":"x-primestack-key-id: psk_example\\nx-primestack-timestamp: 1762529200000\\nx-primestack-signature: HMAC-SHA256(secret, signingPayload)"},
      "banking":{"nav":"Banking","eyebrow":"Banking Rails","title":"Connect.<br><em>banking rails.</em>","description":"Coordinate SWIFT, SEPA, ACH, Fedwire, UPI, local bank routes, virtual accounts, settlement instructions, and correspondent-bank operations.","section":"Banking connects payment instruction to account movement.","detail":"The banking service maintains route metadata, receiving account profiles, bank connectivity instructions, settlement status, and reconciliation context across domestic and international networks.","cards":[["01","Receiving accounts","Map approved accounts and settlement destinations."],["02","Rail selection","Choose a supported route based on currency, country, and instruction."],["03","Settlement reconciliation","Match bank movement to ledger entries and transaction references."]],"flow":[["Identify","Collect currency, country, and destination details."],["Select rail","Choose the approved banking or local payment route."],["Submit instruction","Create the bank or settlement instruction."],["Monitor","Track accepted, processing, completed, and failed states."],["Reconcile","Match external settlement to the PrimeStack journal."]],"code":"POST /banking/route\\n{\\n  \\\"currency\\\": \\\"EUR\\\",\\n  \\\"rail\\\": \\\"SEPA\\\",\\n  \\\"amount\\\": \\\"5000.00\\\",\\n  \\\"settlementAccount\\\": \\\"DE-RECEIVING-001\\\"\\n}"},
      "wallets":{"nav":"Wallets","eyebrow":"Wallet Accounts","title":"Balances.<br><em>and holds.</em>","description":"Model customer balances, credits, debits, pending holds, available funds, internal transfers, and wallet account history.","section":"Wallet operations remain ledger-backed.","detail":"The wallet service gives applications an account balance view while preserving strict movement controls in the ledger. Every balance change links to an approved business event and balanced accounting entry.","cards":[["01","Balance views","Separate available, pending, reserved, and settled amounts."],["02","Controlled movements","Credit or debit only through validated wallet operations."],["03","Transaction history","Trace each movement back to its payment or settlement reference."]],"flow":[["Create wallet","Provision an account under the approved customer."],["Fund wallet","Post an authorized credit with reference."],["Reserve funds","Create a hold when a payment is pending."],["Settle movement","Release, debit, or reverse the reserved amount."],["Report","Return available balance and movement history."]],"code":"GET /wallets/WALLET-001/balance\\n{\\n  \\\"available\\\": \\\"12500.00\\\",\\n  \\\"pending\\\": \\\"250.00\\\",\\n  \\\"currency\\\": \\\"USD\\\"\\n}"},
      "iso20022":{"nav":"ISO 20022","eyebrow":"Structured Payments","title":"Structured.<br><em>payment data.</em>","description":"Represent payment instruction, bank routing, purpose, end-to-end references, status, and reconciliation context with structured ISO 20022 messages.","section":"Structured context travels with the payment.","detail":"ISO 20022 service transforms approved payment data into consistent XML-compatible structures for initiation, clearing, settlement, and status reporting workflows.","cards":[["01","Payment initiation","Create pain instruction structures."],["02","Clearing messages","Represent pacs and status message flows."],["03","End-to-end reference","Preserve a traceable payment identifier across systems."]],"flow":[["Validate","Check required parties, amount, and currency."],["Map","Create structured ISO message fields."],["Serialize","Generate XML or normalized JSON representation."],["Transport","Send through the approved route."],["Monitor status","Track acceptance, completion, rejection, or return."]],"code":"<CstmrCdtTrfInitn>\\n  <GrpHdr>\\n    <MsgId>PS-20261107-001</MsgId>\\n    <CtrlSum>1000.00</CtrlSum>\\n  </GrpHdr>\\n</CstmrCdtTrfInitn>"},
      "iso8583":{"nav":"ISO 8583","eyebrow":"Card Messaging","title":"Card.<br><em>message engine.</em>","description":"Coordinate authorization, capture, reversal, void, chargeback, terminal response, and network routing with ISO 8583 message types.","section":"Card transaction messages move through a controlled switch.","detail":"ISO 8583 service handles fixed-position card transaction messages and maps them into the PrimeStack transaction lifecycle. It coordinates authorization, clearing, reversal, and network response state.","cards":[["01","Authorization","Process message type 0100 and approval decisions."],["02","Capture and clearing","Connect approved activity to settlement records."],["03","Reversal and void","Handle 0420 reversals and later transaction corrections."]],"flow":[["Receive","Parse ISO 8583 fields from the host message."],["Validate","Check terminal, amount, PAN reference, and message type."],["Route","Select an approved acquirer or network route."],["Respond","Create the coded host response message."],["Reconcile","Record authorization and clearing state."]],"code":"MTI: 0100\\nProcessing Code: 000000\\nAmount: 000000100000\\nTerminal: TERM-001\\nResponse: Awaiting host authorization"},
      "ping":{"nav":"Ping & Health","eyebrow":"Network Connectivity","title":"Check.<br><em>connectivity.</em>","description":"Verify API availability, terminal approval, IP connectivity, latency, service health, and network routing before live payment operations.","section":"Confirm operational readiness before sending value.","detail":"Ping and health service gives partners a lightweight way to validate connectivity and platform availability. It is not a financial transfer and should run before production transaction workflows.","cards":[["01","Service health","Check dashboard, API, routing, and ledger availability."],["02","Terminal ping","Confirm sender terminal identity and approved network address."],["03","Latency visibility","Measure round-trip response time and operational reachability."]],"flow":[["Call health","Request the public health endpoint."],["Submit terminal ping","Send the registered terminal ID."],["Verify IP","Confirm the caller address is approved."],["Return status","Receive latency and service state."],["Continue","Enable transfer operations when all checks pass."]],"code":"POST /t2t/ping\\n{\\n  \\\"terminalId\\\": \\\"SA-TERM-001\\\"\\n}\\n\\nResponse: { \\\"status\\\": \\\"ok\\\", \\\"terminal\\\": \\\"verified\\\" }"}
    };
    const requested=(location.pathname.split("/").pop()||"t2t").toLowerCase();
    const page=services[requested]||services.t2t;
    document.title=`PrimeStack Developer — ${page.nav}`;
    document.getElementById("eyebrow").textContent=page.eyebrow;
    document.getElementById("title").innerHTML=page.title;
    document.getElementById("description").textContent=page.description;
    document.getElementById("sectionTitle").textContent=page.section;
    document.getElementById("sectionDescription").textContent=page.detail;
    document.getElementById("serviceCards").innerHTML=page.cards.map(c=>`<article class="card"><div class="card-no">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p></article>`).join("");
    document.getElementById("flowSteps").innerHTML=page.flow.map((s,i)=>`<div class="step"><div class="step-no">${i+1}</div><div><strong>${s[0]}</strong><span>${s[1]}</span></div></div>`).join("");
    document.getElementById("exampleCode").textContent=page.code;
    document.getElementById("serviceNav").innerHTML=Object.entries(services).map(([slug,item])=>`<a href="/developer/${slug}" class="${slug===requested?'active':''}">${item.nav}</a>`).join("");
  </script>
</body>
</html>
